name: Build site daily

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  # Single job: the previous check-diff / build split built the whole site twice
  # (once to detect a diff, once to commit it) and paid for two runners.
  build:
    timeout-minutes: 20
    permissions:
      contents: read
    runs-on: ubuntu-latest
    environment: main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node

      # `astro build` runs the fetch-media-data integration, which is what may
      # produce new content files. `astro check` is not needed here; the PR this
      # job opens runs the full CI workflow anyway.
      - name: Build site and check diff
        id: check-diff
        run: |
          pnpm exec astro build
          if [[ -n $(git status --porcelain) ]]; then
            echo "Changes detected"
            git diff .
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes"
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: steps.check-diff.outputs.has_diff == 'true'
        id: app-token
        with:
          app-id: ${{ secrets.GH_APP_SOTA1235_PR_EDITOR_APP_ID }}
          private-key: ${{ secrets.GH_APP_SOTA1235_PR_EDITOR_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create pull request
        if: steps.check-diff.outputs.has_diff == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          DATE="$(date +%Y%m%d)"
          BRANCH_NAME="feat-build-site-daily-$DATE"

          # see: https://qiita.com/thaim/items/3d1a4d09ec4a7d8844ce#github-actionsbot
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          git checkout -b "$BRANCH_NAME"
          git add .
          git commit -m "modify: build site daily(by GitHub Actions)"
          # TODO: post step to remove branch for duplication error
          git push origin "$BRANCH_NAME"
          gh pr create \
            -R "$REPO" \
            --title "[automation]build site daily - $DATE" \
            --body "build site daily" \
            --base main \
            --head "$BRANCH_NAME"
          PR_NUMBER="$(gh pr list -R "$REPO" --base main --head "$BRANCH_NAME" --json number --jq '.[0].number')"
          # Try to enable auto-merge first (waits for required checks). If the PR
          # is already in a "clean" mergeable state, enablePullRequestAutoMerge
          # fails ("Pull request is in clean status"), so fall back to a direct merge.
          gh pr merge "$PR_NUMBER" -R "$REPO" --auto --merge \
            || gh pr merge "$PR_NUMBER" -R "$REPO" --merge
