name: CI

on:
  pull_request:
    paths-ignore:
      - README.md
      - renovate.json
      - .gitignore
      - CNAME
      - .github/*
      - '!.github/workflows/ci.yml'

# Cancel outdated runs on the same PR (e.g. renovate rebases) to save Actions minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # All checks live in a single job on purpose:
  # Actions billing rounds every job up to a full minute, and lint / astro check /
  # a11y / lighthouse each needed their own checkout + pnpm install + build.
  # Sharing one runner lets us build the site exactly once.
  ci:
    timeout-minutes: 20
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: Linting
        run: pnpm run format:check

      - name: Run astro check
        run: pnpm exec astro check

      # `pnpm run build` would run `astro check` again, so build directly.
      - name: Build site
        run: pnpm exec astro build

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Check a11y
        run: pnpm run a11y-check

      - name: Run lighthouse
        run: pnpm run lhci --upload.target=temporary-public-storage
